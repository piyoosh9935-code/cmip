version: "3.9"

services:
  postgres:
    # was plain postgres:15 with a shared_preload_libraries=pgvector command override -
    # that image has no pgvector extension so it would fail on startup. Fixed to the
    # image that actually ships it.
    image: pgvector/pgvector:pg15
    container_name: cmip_postgres
    restart: always
    environment:
      POSTGRES_USER: cmip
      POSTGRES_PASSWORD: cmip123
      POSTGRES_DB: cmip
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ingestion/postgres/init_extensions.sql:/docker-entrypoint-initdb.d/01_init_extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmip -d cmip"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    container_name: cmip_adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant
    container_name: cmip_qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: cmip_mlflow
    restart: always
    ports:
      - "5001:5000"
    volumes:
      - mlflow_data:/mlflow
    # --host 0.0.0.0 is required: MLflow 3.x's server defaults to binding 127.0.0.1
    # inside the container for security, which Docker's port mapping can't reach at
    # all (it forwards to the container's network interface, not its loopback).
    # --artifacts-destination (not --default-artifact-root): the client logging
    # artifacts runs on the host, not inside this container, so artifact URIs must use
    # MLflow's proxied "mlflow-artifacts:/" scheme (routed through this server's HTTP
    # API) rather than a literal filesystem path the client can't actually reach.
    # --allowed-hosts: MLflow 3.x's Host-header allowlist (a *separate* security layer
    # from --host, which only controls network binding) defaults to localhost/private
    # IPs - a request from the fastapi container arrives with "Host: mlflow:5000" (the
    # Docker Compose service DNS name), which isn't a private IP and gets rejected as
    # a possible DNS-rebinding attack without explicitly allowing it. See CHALLENGES.md.
    command: >
      mlflow server
      --host 0.0.0.0
      --allowed-hosts localhost,127.0.0.1,localhost:5001,127.0.0.1:5001,mlflow,mlflow:5000
      --backend-store-uri sqlite:///mlflow.db
      --artifacts-destination /mlflow

  mcp:
    build:
      context: .
      dockerfile: docker/fastapi/Dockerfile
    container_name: cmip_mcp
    restart: always
    command: ["python", "-m", "mcp_server.server"]
    ports:
      - "8100:8100"
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8100"
      DATABASE_URL: postgresql://cmip:cmip123@postgres:5432/cmip
      QDRANT_URL: http://qdrant:6333
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  fastapi:
    build:
      context: .
      dockerfile: docker/fastapi/Dockerfile
    container_name: cmip_fastapi
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://cmip:cmip123@postgres:5432/cmip
      QDRANT_URL: http://qdrant:6333
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MCP_SERVER_URL: http://mcp:8100/mcp
      # Ollama runs natively on the host, not in this compose stack - reachable from
      # inside a container via Docker Desktop's host.docker.internal.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      CORS_ALLOW_ORIGINS: http://localhost:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      mlflow:
        condition: service_started
      mcp:
        condition: service_started

volumes:
  postgres_data:
  qdrant_data:
  mlflow_data:

