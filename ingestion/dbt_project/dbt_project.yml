name: 'cmip_dbt'
version: '1.0.0'
profile: 'cmip_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Medallion architecture:
#   bronze - thin 1:1 passthrough views over the raw tables the Python loader wrote
#   silver - cleaned/typed/deduped, incremental (append-only bronze -> only new rows processed)
#   gold   - member-360 marts consumed by retrieval and the API
models:
  cmip_dbt:
    bronze:
      +materialized: view
      +schema: bronze
    silver:
      +materialized: incremental
      +schema: silver
      +on_schema_change: append_new_columns
    gold:
      +materialized: table
      +schema: gold
